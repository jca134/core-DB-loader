<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Filovirus Graph</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#8a2b1f; --code:#f0efe9; --err:#a3261b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --muted:#9a9993; --line:#33332f; --accent:#e0806f; --code:#262624; --err:#f08a7d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; min-height:56px; resize:vertical; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; }
  button { padding:0 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .examples { margin:12px 0 28px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { background:var(--card); color:var(--ink); border:1px solid var(--line); padding:4px 10px; font-weight:400; font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .q { font-weight:600; margin-bottom:10px; }
  .answer { white-space: pre-wrap; }
  details { margin-top:14px; }
  summary { cursor:pointer; color:var(--muted); font-size:.9rem; }
  pre { background:var(--code); padding:10px 12px; border-radius:6px; overflow-x:auto; font-size:.82rem; margin:8px 0 2px; }
  .meta { font-size:.8rem; color:var(--muted); }
  .meta.bad, .error { color:var(--err); }
  .thinking { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Ask the Filovirus Graph</h1>
  <p class="sub">Plain-English questions about Ebola and Marburg viruses, genes, antibodies, grants, patents and papers. Every answer shows the Cypher it ran, so you can check it in Neo4j Browser.</p>
  <form id="f">
    <textarea id="q" placeholder="e.g. Which grants study Marburg virus and which papers did they cite?" required></textarea>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="examples" id="ex"></div>
  <div id="out"></div>
</main>
<script>
const examples = [
  "Which antibodies target the GP gene, and how many neutralize?",
  "Which diseases are linked to Marburg virus strains?",
  "Which papers are cited by both a patent and an NIH grant?",
  "What symptoms do NIH grants mention most often?",
  "Which patents claim the VP40 gene?",
];
const ex = document.getElementById("ex"), q = document.getElementById("q");
for (const e of examples) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = e;
  b.onclick = () => { q.value = e; q.focus(); };
  ex.appendChild(b);
}
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

document.getElementById("f").onsubmit = async (ev) => {
  ev.preventDefault();
  const question = q.value.trim(); if (!question) return;
  const go = document.getElementById("go"), out = document.getElementById("out");
  const card = el("div", "card"); card.appendChild(el("div", "q", question));
  const body = el("div", "thinking", "Writing and running Cypher…"); card.appendChild(body);
  out.prepend(card); go.disabled = true;
  try {
    const r = await fetch("/ask", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question}) });
    const data = await r.json();
    if (data.error) { body.className = "error"; body.textContent = data.error; return; }
    body.className = "answer"; body.textContent = data.answer;
    const d = el("details"); d.appendChild(el("summary", null, `Cypher run (${data.queries.length})`));
    for (const x of data.queries) {
      d.appendChild(el("pre", null, x.cypher));
      d.appendChild(el("div", "meta" + (x.error ? " bad" : ""), x.error ? "error: " + x.error : `${x.rows} rows`));
    }
    card.appendChild(d);
  } catch (e) {
    body.className = "error"; body.textContent = "Request failed: " + e;
  } finally { go.disabled = false; }
};
</script>
</body>
</html>
