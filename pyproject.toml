[project]
name = "core-data-loader"
version = "0.1.0"
description = "Loaders and ETL scripts that ingest BV-BRC, HFV, ImmPort, NCBI, and UCSC filovirus data into a Postgres database."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_data_loader"]
