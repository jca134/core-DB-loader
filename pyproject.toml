[project]
name = "core-data-loader"
version = "0.1.0"
description = "Builds the filovirus (Ebola/Marburg) knowledge graph: source data -> Postgres -> Neo4j, with a query page."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "openpyxl>=3.1",
    "neo4j>=6.4.1",
    "anthropic>=2.8.0",
]

[project.scripts]
filovirus = "core_data_loader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "E9", "B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_data_loader"]
